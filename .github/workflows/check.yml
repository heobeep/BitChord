name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      # Run only the Android phone module; root variant tasks also select TV.
      - name: Phone unit tests
        run: ./gradlew :app:testDevDebugUnitTest

      - name: Run phone instrumentation tests on emulator
        id: phone-instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: ./gradlew :app:connectedDevDebugAndroidTest

      - name: Capture emulator crash diagnostics
        if: failure() && steps.phone-instrumentation.outcome == 'failure'
        run: |
          mkdir -p app/build/reports/emulator
          adb devices -l > app/build/reports/emulator/devices.txt || true
          adb logcat -d -v threadtime -t 8000 > app/build/reports/emulator/logcat.txt || true
          adb shell dumpsys activity processes > app/build/reports/emulator/activity-processes.txt || true
          adb shell dumpsys package com.music.bitchord > app/build/reports/emulator/package.txt || true

      - name: Build the phone dev APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload the phone dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-phone-dev-debug
          path: app/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-phone-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/emulator/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
