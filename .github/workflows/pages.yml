name: Publish BitChord Credits website

on:
  push:
    branches: [song-credits-apk]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy interactive project website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          grep -q 'id="downloadButton"' site/index.html
          grep -q 'INSTALL-COMPATIBILITY.txt' site/app.js
          echo "Static website files and download safety checks are present."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
