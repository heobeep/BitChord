name: Build BitChord Credits APK

on:
  push:
    branches: [song-credits-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-credits-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-37" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Apply the native Song Credits source patch
        run: python3 scripts/build-song-credits/apply.py --repo .

      - name: Run shared metadata tests and build the separate APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:jvmTest :app:assembleCreditsDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Credits-debug-apk
          path: app/build/outputs/apk/credits/debug/*.apk
          if-no-files-found: error
          retention-days: 14
