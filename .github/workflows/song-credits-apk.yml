name: Build BitChord Credits APK

on:
  push:
    branches: [song-credits-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-credits-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          # Android 17 is published as android-37.0; AGP 8.10.1 looks up android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Restore and verify the permanent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is missing. Refusing to publish an APK signed with a temporary key."
            exit 1
          fi
          mkdir -p .ci
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > .ci/credits-signing.keystore
          keytool -list -keystore .ci/credits-signing.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Permanent Credits keystore restored and alias verified."

      - name: Apply the native Song Credits source patch
        run: python3 scripts/build-song-credits/apply.py --repo .

      - name: Apply Credits display cleanup and fork updater fixes
        run: python3 scripts/build-song-credits/finalize.py --repo .

      - name: Normalize contributor names and improve credits
        run: python3 scripts/build-song-credits/fix_generated_sources.py --repo .

      - name: Run shared metadata tests and build the optimized phone APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:jvmTest :app:testCreditsBenchmarkUnitTest :app:assembleCreditsBenchmark -Pbitchord.bundleWear=false

      - name: Verify APK package identity and signing certificate
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/credits/benchmark -maxdepth 1 -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test -n "$PACKAGE"
          if [ "$PACKAGE" = "com.music.bitchord" ]; then
            echo "::error::Credits APK has the original BitChord application ID."
            exit 1
          fi
          echo "Verified separate application ID: $PACKAGE"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_OUTPUT"
          ACTUAL_CERT="$(printf '%s\\n' "$SIGNATURE_OUTPUT" | awk -F': ' '/certificate SHA-256 digest/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          EXPECTED_CERT="cb95906a22d14fc5a2e7b8a54e0d175ef3ab55e7f5ea50bfdcb2bf8e90d7b7fb"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK was not signed with the expected permanent Credits key."
            exit 1
          fi
          echo "Verified permanent signing certificate: $ACTUAL_CERT"

      - name: Verify the optimized phone APK for ARM64 devices
        run: |
          ls -lh app/build/outputs/apk/credits/benchmark/*arm64-v8a*.apk
          test "$(find app/build/outputs/apk/credits/benchmark -maxdepth 1 -name '*arm64-v8a*.apk' | wc -l)" -eq 1

      - name: Upload installable optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Credits-arm64-optimized-apk
          path: app/build/outputs/apk/credits/benchmark/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
