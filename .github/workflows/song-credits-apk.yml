name: Build BitChord Credits APK

on:
  push:
    branches: [song-credits-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-credits-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install --channel=3 \
            "platforms;android-37.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          # Android 17 is published as android-37.0; AGP 8.10.1 looks up android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Restore the stable debug signing key (when configured)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug signing key restored."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not configured; this build will use a temporary debug key."
          fi

      - name: Apply the native Song Credits source patch
        run: python3 scripts/build-song-credits/apply.py --repo .

      - name: Apply Credits display cleanup and fork updater fixes
        run: python3 scripts/build-song-credits/finalize.py --repo .

      - name: Run shared metadata tests and build the optimized phone APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:jvmTest :app:testCreditsBenchmarkUnitTest :app:assembleCreditsBenchmark -Pbitchord.bundleWear=false

      - name: Verify the optimized phone APK for ARM64 devices
        run: |
          ls -lh app/build/outputs/apk/credits/benchmark/*arm64-v8a*.apk
          test "$(find app/build/outputs/apk/credits/benchmark -maxdepth 1 -name '*arm64-v8a*.apk' | wc -l)" -eq 1

      - name: Upload installable optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Credits-arm64-optimized-apk
          path: app/build/outputs/apk/credits/benchmark/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
