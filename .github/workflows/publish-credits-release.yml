name: Publish BitChord Credits release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-credits-release.yml
  workflow_run:
    workflows: ["Build BitChord Credits APK"]
    types: [completed]
    branches: [song-credits-apk]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish the verified ARM64 APK
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '41297714750' }}
      SOURCE_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '5c46c1a1e09c9597583f11619141781d69d8ee9f' }}
    steps:
      - name: Check out the exact source used for the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Verify this is the latest Credits build
        id: latest-build
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          CURRENT_SHA="$(git ls-remote origin refs/heads/song-credits-apk | awk '{print $1}')"
          if [ "$SOURCE_COMMIT_SHA" != "$CURRENT_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $SOURCE_COMMIT_SHA; branch head is $CURRENT_SHA."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Read the app version and prepare release names
        if: steps.latest-build.outputs.current != 'false'
        id: release-meta
        shell: bash
        run: |
          VERSION="$(grep -E '^extra\["bitchordVersionName"\] = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "Could not read bitchordVersionName from build.gradle.kts."
            exit 1
          fi
          TAG="credits-v${VERSION}"
          APK_NAME="BitChord-Credits-v${VERSION}-arm64-v8a.apk"
          CHECKSUM_NAME="${APK_NAME}.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=BitChord Credits v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG from $SOURCE_COMMIT_SHA"

      - name: Check whether this version is already published
        if: steps.latest-build.outputs.current != 'false'
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; leaving the published release untouched."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the APK from the successful build run
        if: steps.latest-build.outputs.current != 'false'
        if: steps.release-check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: BitChord-Credits-arm64-optimized-apk
          path: release-assets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and prepare release files
        if: steps.latest-build.outputs.current != 'false'
        if: steps.release-check.outputs.exists == 'false'
        shell: bash
        env:
          APK_NAME: ${{ steps.release-meta.outputs.apk_name }}
          CHECKSUM_NAME: ${{ steps.release-meta.outputs.checksum_name }}
        run: |
          mapfile -t apks < <(find release-assets -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK in the build artifact; found ${#apks[@]}."
            find release-assets -maxdepth 3 -type f -print
            exit 1
          fi

          mv "${apks[0]}" "release-assets/$APK_NAME"
          sha256sum "release-assets/$APK_NAME" > "release-assets/$CHECKSUM_NAME"
          ls -lh release-assets/

      - name: Create the GitHub release and attach the APK
        if: steps.latest-build.outputs.current != 'false'
        if: steps.release-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: ${{ steps.release-meta.outputs.title }}
          target_commitish: ${{ env.SOURCE_COMMIT_SHA }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ steps.release-meta.outputs.apk_name }}
            release-assets/${{ steps.release-meta.outputs.checksum_name }}
          body: |
            ## BitChord Credits v${{ steps.release-meta.outputs.version }}

            An independent BitChord community fork with a native song-credits experience and optional Credits.fm integration.

            ### Download
            - **${{ steps.release-meta.outputs.apk_name }}** — optimized Android ARM64 phone build.
            - **${{ steps.release-meta.outputs.checksum_name }}** — SHA-256 checksum for verification.

            ### Install notes
            - ARM64 only; not a universal APK.
            - Uses a separate application ID so it can coexist with the original BitChord app.
            - A stable CI signing key is used only when DEBUG_KEYSTORE_BASE64 is configured. The first update from v1.9 may still require reinstalling if its original signing key differs.
            - The build runs shared metadata tests and the Credits app unit tests. Physical-device compatibility testing is not implied by a successful CI build.

            See the [README](https://github.com/heobeep/BitChord#readme) for features, setup, compatibility and project details.
