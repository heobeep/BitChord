name: Publish BitChord Credits release

on:
  workflow_run:
    workflows: ["Build BitChord Credits APK"]
    types: [completed]
    branches: [song-credits-apk]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified Android install builds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the exact source used for the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}

      - name: Verify this is the latest Credits build
        id: latest-build
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/song-credits-apk | awk '{print $1}')"
          if [ "$SOURCE_COMMIT_SHA" != "$CURRENT_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $SOURCE_COMMIT_SHA; branch head is $CURRENT_SHA."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the app version and prepare release names
        if: steps.latest-build.outputs.current == 'true'
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^extra\["bitchordVersionName"\] = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read bitchordVersionName from build.gradle.kts."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=credits-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=BitChord Credits v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version already exists
        if: steps.latest-build.outputs.current == 'true'
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; its assets and notes will be reconciled with this validated build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the APKs from the successful build
        if: steps.latest-build.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: BitChord-Credits-all-installers
          path: release-assets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the safe install matrix and prepare checksums
        if: steps.latest-build.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/DOWNLOADS.md
          test -s release-assets/INSTALL-COMPATIBILITY.txt

          mapfile -t keep_apks < <(find release-assets -maxdepth 1 -type f -name 'BitChord-Credits-Keep-*.apk' -print)
          mapfile -t replace_apks < <(find release-assets -maxdepth 1 -type f -name 'BitChord-Credits-Replace-*.apk' -print)

          if [ "${#keep_apks[@]}" -ne 4 ]; then
            echo "::error::Expected four Keep Original APKs; found ${#keep_apks[@]}."
            find release-assets -maxdepth 1 -type f -print
            exit 1
          fi

          for suffix in '-universal.apk' '_arm64-v8a.apk' '_armeabi-v7a.apk' '_x86_64.apk'; do
            matches="$(find release-assets -maxdepth 1 -type f -name "BitChord-Credits-Keep-*$suffix" | wc -l)"
            if [ "$matches" -ne 1 ]; then
              echo "::error::Expected exactly one Keep Original build ending in $suffix; found $matches."
              exit 1
            fi
          done

          if grep -Eq '^INSTALL COMPATIBILITY: MATCH -' release-assets/INSTALL-COMPATIBILITY.txt; then
            if [ "${#replace_apks[@]}" -ne 4 ]; then
              echo "::error::Compatibility says MATCH, but the four Replace APKs are not all present."
              exit 1
            fi
            for suffix in '_universal.apk' '_arm64-v8a.apk' '_armeabi-v7a.apk' '_x86_64.apk'; do
              matches="$(find release-assets -maxdepth 1 -type f -name "BitChord-Credits-Replace-*$suffix" | wc -l)"
              if [ "$matches" -ne 1 ]; then
                echo "::error::Expected exactly one Replace build ending in $suffix; found $matches."
                exit 1
              fi
            done
            echo "Replacement compatibility MATCH: publishing all four Replace builds."
          else
            if [ "${#replace_apks[@]}" -ne 0 ]; then
              echo "::error::Compatibility is not MATCH, but Replace APKs are present. Refusing publication."
              exit 1
            fi
            echo "Replacement compatibility is not MATCH: publishing Keep Original only."
          fi

          for file in release-assets/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sha256) continue ;;
            esac
            sha256sum "$file" > "$file.sha256"
          done
          ls -lh release-assets/

      - name: Remove unsafe Replace downloads from an existing release
        if: steps.latest-build.outputs.current == 'true' && steps.release-check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^INSTALL COMPATIBILITY: MATCH -' release-assets/INSTALL-COMPATIBILITY.txt; then
            echo "Compatibility is MATCH; the validated Replace downloads will be refreshed."
            exit 0
          fi

          echo "Compatibility is not MATCH; deleting every pre-existing Replace APK and checksum from $TAG."
          while IFS= read -r asset; do
            case "$asset" in
              BitChord-Credits-Replace-*.apk|BitChord-Credits-Replace-*.apk.sha256)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

      - name: Create the GitHub release and attach verified downloads
        if: steps.latest-build.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: ${{ steps.release-meta.outputs.title }}
          target_commitish: ${{ env.SOURCE_COMMIT_SHA }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/*
          body: |
            ## BitChord Credits v${{ steps.release-meta.outputs.version }}

            Choose an install mode first, then choose a device build.

            ### Keep original BitChord (recommended)
            Installs BitChord Credits separately and leaves the official BitChord app installed. Universal is the easiest choice if you are unsure which download fits your phone.

            ### Replace original BitChord
            Replace APKs are included only when INSTALL-COMPATIBILITY.txt reports an exact MATCH for the official release checked during this build. If no Replace APKs are attached, do not uninstall the original app; use Keep Original instead.

            ### Device builds
            - Universal: easiest choice if you do not know your device type.
            - arm64-v8a: most recent Android phones and tablets.
            - armeabi-v7a: older 32-bit Android phones.
            - x86_64: Android emulators and x86_64 Chromebooks.

            All published files include SHA-256 checksum files. See DOWNLOADS.md for the complete installation guide.
