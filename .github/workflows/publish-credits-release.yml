name: Publish BitChord Credits release

on:
  workflow_run:
    workflows: ["Build BitChord Credits APK"]
    types: [completed]
    branches: [song-credits-apk]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish the verified ARM64 APK
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the exact source used for the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Verify this is the latest Credits build
        id: latest-build
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          CURRENT_SHA="$(git ls-remote origin refs/heads/song-credits-apk | awk '{print $1}')"
          if [ "$SOURCE_COMMIT_SHA" != "$CURRENT_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale build $SOURCE_COMMIT_SHA; branch head is $CURRENT_SHA."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Read the app version and prepare release names
        if: steps.latest-build.outputs.current != 'false'
        id: release-meta
        shell: bash
        run: |
          VERSION="$(grep -E '^extra\["bitchordVersionName"\] = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "Could not read bitchordVersionName from build.gradle.kts."
            exit 1
          fi
          TAG="credits-v${VERSION}"
          APK_NAME="BitChord-Credits-v${VERSION}_arm64-v8a.apk"
          CHECKSUM_NAME="${APK_NAME}.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=BitChord Credits v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG from $SOURCE_COMMIT_SHA"

      - name: Check whether this version is already published
        if: steps.latest-build.outputs.current != 'false'
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; leaving the published release untouched."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the APK from the successful build run
        if: steps.latest-build.outputs.current != 'false' && steps.release-check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: BitChord-Credits-all-installers
          path: release-assets
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all install modes and prepare checksums
        if: steps.latest-build.outputs.current != 'false' && steps.release-check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-assets -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 8 ]; then
            echo "Expected 8 APKs (4 architectures × 2 install modes); found ${#apks[@]}."
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            sha256sum "$apk" > "$apk.sha256"
          done
          test -s release-assets/DOWNLOADS.md
          test -s release-assets/INSTALL-COMPATIBILITY.txt
          ls -lh release-assets/

      - name: Create the GitHub release and attach the APK
        if: steps.latest-build.outputs.current != 'false' && steps.release-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: ${{ steps.release-meta.outputs.title }}
          target_commitish: ${{ env.SOURCE_COMMIT_SHA }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.apk.sha256
            release-assets/DOWNLOADS.md
            release-assets/INSTALL-COMPATIBILITY.txt
          body: |
            ## BitChord Credits v${{ steps.release-meta.outputs.version }}

            Choose an install mode first, then choose a device build.

            ### Keep original BitChord (recommended)
            Installs BitChord Credits separately and leaves the official BitChord app installed.

            ### Replace original BitChord
            Uses the original package ID. Read INSTALL-COMPATIBILITY.txt before installing:
            - MATCH means the official release checked in CI has the same signing certificate and a lower versionCode.
            - MISMATCH or UNVERIFIED means Android will not safely update the installed official app. Uninstall it first; this can erase private app data.

            ### Device builds
            - Universal: easiest choice if you do not know your device architecture.
            - arm64-v8a: most recent Android phones and tablets.
            - armeabi-v7a: older 32-bit ARM devices.
            - x86_64: Android emulators and x86_64 Chromebooks.

            All APKs include SHA-256 checksum files. See DOWNLOADS.md for the complete installation guide.
